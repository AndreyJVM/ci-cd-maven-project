<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Сокращатель ссылок')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('links')}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="fw-bold mb-4">🔗 Сервис сокращения ссылок</h1>
            <p class="text-muted">Вставьте длинную ссылку и получите короткую</p>

            <div class="card-custom card p-4">
                <div class="input-group mb-3">
                    <input type="url" id="url-input" class="form-control form-control-custom"
                           placeholder="https://example.com/very/long/url">
                    <button onclick="createShortLink()" class="btn btn-primary-custom">
                        <i class="fas fa-cut me-1"></i>Сократить
                    </button>
                </div>

                <div id="result" style="display: none;">
                    <div class="alert alert-success d-flex align-items-center justify-content-between">
                        <span id="short-url-text" class="fw-bold"></span>
                        <button onclick="copyToClipboard()" class="btn btn-sm btn-outline-custom">
                            <i class="fas fa-copy"></i> Копировать
                        </button>
                    </div>
                </div>

                <div id="error" style="display: none;">
                    <div class="alert alert-danger" id="error-text"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: theme-script}"></div>

<script>
    async function createShortLink() {
        const input = document.getElementById('url-input');
        const url = input.value.trim();
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        resultDiv.style.display = 'none';
        errorDiv.style.display = 'none';

        if (!url) {
            showError('Пожалуйста, введите ссылку');
            return;
        }

        try {
            const response = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            if (!response.ok) {
                throw new Error('Ошибка сервера');
            }

            const data = await response.json();
            document.getElementById('short-url-text').textContent = data.shortUrl;
            resultDiv.style.display = 'block';
        } catch (error) {
            showError('Не удалось создать короткую ссылку. Проверьте URL.');
        }
    }

    function showError(message) {
        document.getElementById('error-text').textContent = message;
        document.getElementById('error').style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('short-url-text').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('Ссылка скопирована!');
        }).catch(() => {
            // fallback
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Ссылка скопирована!');
        });
    }
</script>
</body>
</html>
