<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head(
    title='Что-то пошло не так',
    description='Ошибка при обработке запроса',
    keywords='error',
    ogTitle='Ошибка',
    ogDescription='Что-то пошло не так',
    ogImage='',
    ogUrl=''
)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<main class="container py-5 text-center my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-4">
                <div class="display-1 fw-bold text-primary mb-3">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <h1 class="h2 fw-bold mb-3">Что-то пошло не так</h1>
                <p class="text-muted mb-4">
                    Мы не смогли найти запрашиваемую страницу или возникла непредвиденная ошибка. Уже разбираемся!
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4">
                        <i class="fas fa-house me-2"></i>На главную
                    </a>
                    <a th:href="@{/qr}" class="btn btn-outline-secondary px-4">
                        <i class="fas fa-qrcode me-2"></i>QR-генератор
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
