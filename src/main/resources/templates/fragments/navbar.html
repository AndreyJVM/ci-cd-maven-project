<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav class="navbar navbar-expand-lg navbar-custom fixed-top" th:fragment="navbar(active)">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-code me-2"></i>Andrey Vorobev
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active' : ''" href="/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'about'} ? 'active' : ''" href="/about">Обо мне</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'projects'} ? 'active' : ''" href="/projects">Проекты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'links'} ? 'active' : ''" href="/links">Сокращатель ссылок</a>
                </li>
                <li class="nav-item ms-2">
                    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Скрипт для тёмной темы -->
<script th:fragment="theme-script">
    (function() {
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            html.setAttribute('data-theme', 'dark');
            if (themeIcon) themeIcon.className = 'fas fa-sun';
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                if (html.getAttribute('data-theme') === 'dark') {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                    if (themeIcon) themeIcon.className = 'fas fa-moon';
                } else {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    if (themeIcon) themeIcon.className = 'fas fa-sun';
                }
            });
        }
    })();
</script>
