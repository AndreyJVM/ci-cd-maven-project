version: '3.8'

services:
  # ========== JAVA-ПРИЛОЖЕНИЕ ==========
  app:
    image: andreyvorobevaqa/ci-cd-maven-project:latest
    container_name: my-java-app
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx256m -Xms128m

  # ========== NGINX (РЕВЕРС-ПРОКСИ + SSL) ==========
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (для редиректа на HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # Конфиг Nginx
      - ./ssl:/etc/nginx/ssl:ro                                 # Папка с сертификатами
    depends_on:
      - app
    networks:
      - app-network


networks:
  app-network:
    driver: bridge