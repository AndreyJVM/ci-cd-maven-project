name: Build and Push Docker Image

# Триггеры: запуск при пуше в main и при создании тега (релиза)
on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # Запуск при тегах вида v1.0, v2.3.1 и т.д.
  pull_request:
    branches:
      - master

# Переменные, которые будем использовать во всем workflow
env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/ci-cd-maven-project

jobs:
  # ==========================================
  # JOB 1: Сборка и тестирование (Maven)
  # ==========================================
  build-and-test:
    name: Build with Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean verify
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ==========================================
  # JOB 2: Сборка Docker и пуш в Docker Hub
  # ==========================================
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # ==========================================
  # JOB 3: Деплой на VDS (НОВЫЙ!)
  # ==========================================
  deploy-to-vds:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deploy script to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "deploy.sh"
          target: "/home/${{ secrets.VDS_USER }}/apps/my-app/"

      - name: Execute deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VDS_USER }}/apps/my-app/
            chmod +x deploy.sh
            ./deploy.sh