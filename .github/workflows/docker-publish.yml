name: Build and Push Docker Image

# Триггеры: запуск при пуше в main и при создании тега (релиза)
on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # Запуск при тегах вида v1.0, v2.3.1 и т.д.
  pull_request:
    branches:
      - master

# Переменные, которые будем использовать во всем workflow
env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/ci-cd-maven-project

jobs:
  # ==========================================
  # JOB 1: Сборка и тестирование
  # ==========================================
  build-and-test:
    name: Build with Maven
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'  # Кешируем зависимости Maven для ускорения

      # 3. Собираем и тестируем проект
      - name: Build with Maven
        run: mvn clean verify

      # 4. Сохраняем собранный JAR как артефакт (для следующего job)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ==========================================
  # JOB 2: Сборка Docker образа и пуш в Docker Hub
  # ==========================================
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Этот job зависит от первого. Он запустится только если сборка и тесты прошли успешно
    needs: build-and-test

    # Запускаем только для main ветки или тегов (не для пул-реквестов)
    if: github.event_name != 'pull_request'

    steps:
      # Снова клонируем код (нужен для контекста сборки Docker)
      - name: Checkout code
        uses: actions/checkout@v4

      # Скачиваем JAR-артефакт из предыдущего job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Логинимся в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Собираем Docker образ с несколькими тегами
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            # Если это пуш тега (релиз), добавляем тег с версией
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}